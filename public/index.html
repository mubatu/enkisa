<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>enkısa</title>
<meta name="description" content="Linkleri en kısa haline getir.">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="home">
  <a class="brand" href="/">
    <span>enkısa</span>
  </a>

  <form id="create" class="shorten" autocomplete="off">
    <div class="field">
      <input id="url" type="text" inputmode="url" placeholder="Uzun linki yapıştır" aria-label="Uzun link" required autofocus>
      <button id="alias-toggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="alias-wrap" title="Özel ad">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
      <button class="primary" type="submit">Kısalt</button>
    </div>

    <div id="alias-wrap" class="alias-wrap">
      <div>
        <label class="alias">
          <span class="host"></span>
          <input id="code" type="text" placeholder="özel-ad" maxlength="32" aria-label="Özel ad" tabindex="-1">
        </label>
      </div>
    </div>

    <p id="msg" class="msg" role="alert"></p>

    <div id="result" class="result" hidden>
      <a id="short" class="result-link" target="_blank" rel="noopener"></a>
      <div id="target" class="result-target"></div>
      <div class="actions">
        <button id="copy" type="button" class="btn dark">Kopyala</button>
        <button id="qr-toggle" type="button" class="btn">QR kod</button>
      </div>
      <div id="qr" class="qr" hidden></div>
    </div>
  </form>
</main>

<script src="/common.js"></script>
<script>
  document.querySelector(".alias .host").textContent = location.host + "/";

  // ---------- Custom alias toggle ----------
  const toggle = $("alias-toggle");
  const aliasWrap = $("alias-wrap");

  function setAlias(open) {
    aliasWrap.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open);
    $("code").tabIndex = open ? 0 : -1;
    if (open) setTimeout(() => $("code").focus(), 150);
    else $("code").value = "";
  }
  toggle.onclick = () => setAlias(!aliasWrap.classList.contains("open"));

  // ---------- Create ----------
  let current = null;

  $("create").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.target.querySelector(".primary");
    $("msg").textContent = "";
    button.disabled = true;
    try {
      current = await api("POST", "/api/links", { url: $("url").value, code: $("code").value });
      $("short").textContent = current.short.replace(/^https?:\/\//, "");
      $("short").href = current.short;
      $("target").textContent = current.url;
      $("qr").hidden = true;
      $("result").hidden = false;
      $("url").value = "";
      setAlias(false);
      copy(current.short, $("copy"));
    } catch (err) {
      $("msg").textContent = err.message;
    } finally {
      button.disabled = false;
    }
  });

  $("copy").onclick = () => current && copy(current.short, $("copy"));
  $("qr-toggle").onclick = () => {
    if ($("qr").hidden) renderQr($("qr"), current.code);
    $("qr").hidden = !$("qr").hidden;
  };
</script>
</body>
</html>
