<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<title>enkısa</title>
<meta name="description" content="Linkleri en kısa haline getir.">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="home">
  <a class="brand" href="/">
    <span>enkısa</span>
  </a>

  <form id="create" class="shorten" autocomplete="off">
    <div class="field">
      <div class="field-box">
        <input id="url" type="text" inputmode="url" placeholder="Uzun linki yapıştır" aria-label="Uzun link" required autofocus>
        <button id="paste" class="icon-btn" type="button" title="Panodan yapıştır" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M16 4h2a2 2 0 0 1 2 2v4"/><path d="M21 14H11"/><path d="m15 10-4 4 4 4"/>
          </svg>
        </button>
        <button id="alias-toggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="alias-wrap" title="Özel ad">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>
      </div>
      <button class="primary" type="submit">Kısalt</button>
    </div>

    <div id="alias-wrap" class="alias-wrap">
      <div>
        <label class="alias">
          <span class="host"></span>
          <input id="code" type="text" placeholder="özel-ad" maxlength="32" aria-label="Özel ad" tabindex="-1">
        </label>
      </div>
    </div>

    <p id="msg" class="msg" role="alert"></p>

    <div id="result" class="result" hidden>
      <div class="result-head">
        <a id="short" class="result-link" target="_blank" rel="noopener"></a>
        <button id="copy" class="icon-btn sm" type="button" title="Kopyala" aria-label="Kopyala">
          <svg class="i-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          <svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </button>
        <button id="qr-toggle" class="icon-btn sm" type="button" title="QR kod" aria-label="QR kod" aria-expanded="false" aria-controls="qr">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>
          </svg>
        </button>
      </div>
      <div id="target" class="result-target"></div>
      <div id="qr" class="qr" hidden></div>
    </div>
  </form>
</main>

<script src="/common.js"></script>
<script>
  document.querySelector(".alias .host").textContent = location.host + "/";

  // ---------- Paste from clipboard ----------
  // Shown only while the field is empty and the browser can read the clipboard.
  const pasteBtn = $("paste");
  const canPaste = !!navigator.clipboard?.readText;
  const syncPaste = () => (pasteBtn.hidden = !canPaste || $("url").value !== "");
  syncPaste();
  $("url").addEventListener("input", syncPaste);

  pasteBtn.onclick = async () => {
    $("msg").textContent = "";
    try {
      const text = (await navigator.clipboard.readText()).trim();
      if (!text) throw new Error("empty");
      $("url").value = text;
      syncPaste();
    } catch {
      $("msg").textContent = "Panoya erişilemedi, linki elle yapıştır.";
    }
    $("url").focus();
  };

  // ---------- Custom alias toggle ----------
  const toggle = $("alias-toggle");
  const aliasWrap = $("alias-wrap");

  function setAlias(open) {
    aliasWrap.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open);
    $("code").tabIndex = open ? 0 : -1;
    if (open) setTimeout(() => $("code").focus(), 150);
    else $("code").value = "";
  }
  toggle.onclick = () => setAlias(!aliasWrap.classList.contains("open"));

  // ---------- Create ----------
  let current = null;

  $("create").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.target.querySelector(".primary");
    $("msg").textContent = "";
    button.disabled = true;
    try {
      current = await api("POST", "/api/links", { url: $("url").value, code: $("code").value });
      $("short").textContent = current.short.replace(/^https?:\/\//, "");
      $("short").href = current.short;
      $("target").textContent = current.url;
      setQr(false);
      $("result").hidden = false;
      $("url").value = "";
      syncPaste();
      setAlias(false);
      copy(current.short, $("copy"));
    } catch (err) {
      $("msg").textContent = err.message;
    } finally {
      button.disabled = false;
    }
  });

  $("copy").onclick = () => current && copy(current.short, $("copy"));
  function setQr(open) {
    if (open) renderQr($("qr"), current.code);
    $("qr").hidden = !open;
    $("qr-toggle").setAttribute("aria-expanded", open);
  }
  $("qr-toggle").onclick = () => setQr($("qr").hidden);
</script>
</body>
</html>
